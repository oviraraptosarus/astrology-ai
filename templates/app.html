<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
  <title>Astrology AI</title>
  <meta name="description" content="Your personal Vedic astrology — read simply.">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Astrology AI">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <link rel="icon" href="/static/icons/favicon-64.png">
  <link rel="stylesheet" href="/static/product.css">
  <script>
    // Apply saved/OS appearance BEFORE first paint to avoid a flash.
    (function () {
      try {
        var pref = localStorage.getItem('astro_appearance') || 'system';
        var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>
</head>
<body>
  <div id="app-root" aria-live="polite">
    <div class="loading-full">
      <div class="spinner" role="status" aria-label="Loading"></div>
      <p>Opening your sky…</p>
    </div>
  </div>
  <div id="sheet-scrim" class="scrim"></div>
  <div id="sheet" class="sheet" role="dialog" aria-modal="true"></div>
  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="/static/product.js"></script>
</body>
</html>
