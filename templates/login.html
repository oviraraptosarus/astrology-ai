<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Astrology AI — Sign in</title>
  <meta name="description" content="Sign in to your personal Vedic astrology guide.">
  <meta name="theme-color" content="#0b0b0f">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <link rel="icon" href="/static/icons/favicon-64.png">
  <link rel="stylesheet" href="/static/product.css">
  <style>
    .terms-box {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      background: var(--card-2);
      border: 1px solid var(--border);
      margin: 14px 0 6px;
      text-align: left;
      cursor: pointer;
      user-select: none;
      transition: border-color 0.2s ease, background 0.2s ease;
    }
    .terms-box:hover {
      border-color: var(--border-strong);
    }
    .terms-box.alert-border {
      border-color: var(--bad) !important;
      background: var(--bad-soft) !important;
    }
    .terms-box input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin-top: 1px;
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
    }
    .terms-box span {
      font-size: var(--t-cap);
      color: var(--text-2);
      line-height: 1.45;
    }
    .terms-box a {
      color: var(--accent);
      text-decoration: underline;
      font-weight: 550;
    }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card stack">
      <div class="center" style="margin-bottom:8px;">
        <img src="/static/icons/icon-192.png" alt="" width="56" height="56" style="border-radius:14px;">
        <h1 style="margin-top:14px;font-size:1.6rem;letter-spacing:-0.03em;">Astrology&nbsp;AI</h1>
        <p class="muted" style="margin-top:3px;font-size:var(--t-sub);">Ancient wisdom, modern precision</p>
      </div>

      <div class="segmented" role="tablist" aria-label="Sign in or create account">
        <button class="on" id="tab-login" role="tab" aria-selected="true" onclick="switchTab('login')">Sign in</button>
        <button id="tab-signup" role="tab" aria-selected="false" onclick="switchTab('signup')">Create account</button>
      </div>

      <div id="alert" class="badge tone-tender hide" role="alert" aria-live="polite" style="width:100%;justify-content:center;padding:10px;font-size:var(--t-cap);border-radius:12px;"></div>

      <!-- Sign In Form -->
      <form class="stack" id="form-login" onsubmit="handleLogin(event)" novalidate>
        <div class="field">
          <label for="login-email">Email</label>
          <input class="input" type="email" id="login-email" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input class="input" type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">Sign in</button>
      </form>

      <!-- Create Account Form -->
      <form class="stack hide" id="form-signup" onsubmit="handleSignup(event)" novalidate>
        <div class="field">
          <label for="signup-name">Full name</label>
          <input class="input" type="text" id="signup-name" placeholder="Arjun Sharma" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="signup-email">Email</label>
          <input class="input" type="email" id="signup-email" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="signup-password">Password</label>
          <input class="input" type="password" id="signup-password" placeholder="At least 6 characters" autocomplete="new-password" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="signup-btn">Create account</button>
      </form>

      <div class="row" style="color:var(--faint);font-size:var(--t-cap);margin:6px 0;">
        <div class="grow" style="height:1px;background:var(--border);"></div>
        <span>or</span>
        <div class="grow" style="height:1px;background:var(--border);"></div>
      </div>

      <!-- Terms & Conditions Checkbox -->
      <label class="terms-box" id="terms-box">
        <input type="checkbox" id="terms-checkbox">
        <span>I agree to the <a href="javascript:void(0)" onclick="openModal('terms', event)">Terms of Service</a> and <a href="javascript:void(0)" onclick="openModal('privacy', event)">Privacy Policy</a>.</span>
      </label>

      <!-- Google Sign In Custom Button -->
      <button type="button" class="btn btn-secondary btn-block" id="btn-google-auth" style="position:relative;gap:10px;font-weight:600;min-height:48px;border-radius:var(--radius-pill);margin-top:6px;">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
        <span>Continue with Google</span>
      </button>

      <!-- Hidden Google Render Container for Fallback Flow -->
      <div id="g_id_hidden" style="position:absolute;width:1px;height:1px;overflow:hidden;opacity:0.01;pointer-events:none;"></div>
    </div>
  </div>

  <!-- In-page Sheet / Modal for Terms & Privacy -->
  <div id="sheet-scrim" class="scrim" onclick="closeModal()"></div>
  <div id="sheet" class="sheet" role="dialog" aria-modal="true">
    <div class="grabber"></div>
    <div class="row-between" style="margin-bottom:12px;">
      <h2 id="modal-title" style="font-size:1.25rem;">Terms &amp; Conditions</h2>
      <button class="icon-btn ghost" onclick="closeModal()" aria-label="Close">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div id="modal-body" class="stack" style="font-size:var(--t-sub);line-height:1.6;color:var(--text-2);"></div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    if (params.get('mode') === 'signup') switchTab('signup');

    // Initialize Google Identity Services
    window.addEventListener('load', () => {
      if (window.google && google.accounts && google.accounts.id) {
        google.accounts.id.initialize({
          client_id: "1074117408479-85ralktijlkae9v0assa5kqa9s3kpop2.apps.googleusercontent.com",
          callback: handleGoogleLogin,
          ux_mode: "popup",
          auto_prompt: false
        });
        const hiddenDiv = document.getElementById('g_id_hidden');
        google.accounts.id.renderButton(hiddenDiv, { type: 'standard', size: 'large' });
      }
    });

    // Custom Continue with Google Button Click Handler
    document.getElementById('btn-google-auth').onclick = function () {
      const checkbox = document.getElementById('terms-checkbox');
      if (!checkbox.checked) {
        showAlert('Please check the box agreeing to the Terms & Privacy Policy to continue with Google.');
        const box = document.getElementById('terms-box');
        box.classList.add('alert-border');
        setTimeout(() => box.classList.remove('alert-border'), 2400);
        return;
      }
      hideAlert();

      if (window.google && google.accounts && google.accounts.id) {
        // Trigger Google Login
        const hiddenBtn = document.querySelector('#g_id_hidden div[role=button]');
        if (hiddenBtn) {
          hiddenBtn.click();
        } else {
          google.accounts.id.prompt((notification) => {
            if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
              showAlert('Google Sign-In popup was blocked or skipped. Please allow popups for this site.');
            }
          });
        }
      } else {
        showAlert('Google Sign-In is loading. Please check your network and try again.');
      }
    };

    async function handleGoogleLogin(response) {
      if (!response.credential) return showAlert('Google sign-in failed');
      try {
        const res = await fetch('/api/auth/google', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ credential: response.credential })
        });
        const data = await res.json();
        if (res.ok) {
          localStorage.setItem('astro_user', JSON.stringify(data.user));
          window.location.href = '/app';
        } else {
          showAlert(data.detail || 'Google sign-in is not available.');
        }
      } catch {
        showAlert('Network error signing in with Google.');
      }
    }

    function switchTab(tab) {
      document.getElementById('tab-login').classList.toggle('on', tab === 'login');
      document.getElementById('tab-signup').classList.toggle('on', tab === 'signup');
      document.getElementById('tab-login').setAttribute('aria-selected', tab === 'login');
      document.getElementById('tab-signup').setAttribute('aria-selected', tab === 'signup');
      document.getElementById('form-login').classList.toggle('hide', tab !== 'login');
      document.getElementById('form-signup').classList.toggle('hide', tab !== 'signup');
      hideAlert();
    }

    function showAlert(msg) {
      const a = document.getElementById('alert');
      a.textContent = msg;
      a.classList.remove('hide');
    }
    function hideAlert() {
      document.getElementById('alert').classList.add('hide');
    }

    function checkTerms() {
      const checkbox = document.getElementById('terms-checkbox');
      if (!checkbox.checked) {
        showAlert('Please check the box agreeing to the Terms & Privacy Policy to continue.');
        const box = document.getElementById('terms-box');
        box.classList.add('alert-border');
        setTimeout(() => box.classList.remove('alert-border'), 2400);
        return false;
      }
      return true;
    }

    async function handleLogin(e) {
      e.preventDefault();
      if (!checkTerms()) return;
      hideAlert();

      const btn = document.getElementById('login-btn');
      btn.disabled = true; btn.textContent = 'Signing in…';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include',
          body: JSON.stringify({
            email: document.getElementById('login-email').value.trim(),
            password: document.getElementById('login-password').value
          })
        });
        const data = await res.json();
        if (res.ok) {
          localStorage.setItem('astro_user', JSON.stringify(data.user));
          window.location.href = '/app';
        } else {
          showAlert(data.detail || 'Login failed. Please verify your credentials.');
        }
      } catch {
        showAlert('Connection error. Is the server running?');
      } finally {
        btn.disabled = false; btn.textContent = 'Sign in';
      }
    }

    async function handleSignup(e) {
      e.preventDefault();
      if (!checkTerms()) return;
      hideAlert();

      const btn = document.getElementById('signup-btn');
      btn.disabled = true; btn.textContent = 'Creating account…';
      try {
        const res = await fetch('/api/auth/signup', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include',
          body: JSON.stringify({
            full_name: document.getElementById('signup-name').value.trim(),
            email: document.getElementById('signup-email').value.trim(),
            password: document.getElementById('signup-password').value
          })
        });
        const data = await res.json();
        if (res.ok) {
          localStorage.setItem('astro_user', JSON.stringify(data.user));
          window.location.href = '/app';
        } else {
          showAlert(data.detail || 'Signup failed. Please try again.');
        }
      } catch {
        showAlert('Connection error. Is the server running?');
      } finally {
        btn.disabled = false; btn.textContent = 'Create account';
      }
    }

    function openModal(type, event) {
          if (event) event.stopPropagation();
          const title = document.getElementById('modal-title');
          const body = document.getElementById('modal-body');
          if (type === 'terms') {
            title.textContent = 'Terms of Service';
            body.innerHTML = `
              <p class="muted" style="font-size:var(--t-micro);margin-bottom:10px;">Last updated: September 2026</p>
              <p><strong>1. The Service</strong><br>Astrology AI ("the Service") provides AI-assisted astrological readings, chart calculations, and interpretations based on the Vedic (Jyotisha) tradition. The Service is provided "as is" and "as available," without warranties of any kind, express or implied, including accuracy, completeness, or fitness for a particular purpose.</p>
              <p><strong>2. Entertainment &amp; Self-Inquiry Only</strong><br>The Service is strictly for entertainment, philosophical reflection, education, and personal spiritual self-inquiry. Astrological interpretations are inherently speculative and reflect symbolic planetary archetypes. The Service does NOT provide medical, psychiatric, legal, financial, investment, or professional advice of any kind. You must not make decisions regarding your health, medical treatments, investments, legal disputes, or personal relationships based on any reading or content provided by the Service. Always consult qualified professionals for such matters.</p>
              <p><strong>3. No Professional Relationship</strong><br>Nothing in the Service creates a practitioner–client, advisory, fiduciary, or professional relationship between you and Astrology AI, its operators, or its creators. Readings are generated by automated systems and AI models; they are not personalized professional consultations.</p>
              <p><strong>4. No Warranties &amp; Limitation of Liability</strong><br>TO THE MAXIMUM EXTENT PERMITTED BY LAW, Astrology AI, its operators, creators, affiliates, and suppliers shall not be liable for any direct, indirect, incidental, special, consequential, or punitive damages, or any loss of profits, revenue, data, or goodwill, arising out of or related to your use of, or inability to use, the Service. If any jurisdiction does not permit the exclusion of certain warranties or liabilities, the scope and duration of such exclusion shall be limited to the minimum extent permitted by applicable law.</p>
              <p><strong>5. Sovereign Human Action</strong><br>Classical Jyotisha tradition teaches that conscious human effort (<em>Purushartha / Kriyamana Karma</em>) is supreme over astrological indications. You assume full responsibility for your personal choices and actions. Under no circumstances is the Service a substitute for your own judgment, effort, or responsibility.</p>
              <p><strong>6. User Conduct</strong><br>You agree not to misuse the Service, including attempting to access another user's data, reverse-engineer the platform, or use it in violation of applicable law. You are responsible for maintaining the confidentiality of your account credentials.</p>
              <p><strong>7. Account Termination</strong><br>We may suspend or terminate your account if you violate these Terms or applicable law, or if we reasonably believe continued service poses a risk to the Service or other users.</p>
              <p><strong>8. Changes to These Terms</strong><br>We may update these Terms from time to time. Continued use of the Service after changes are posted constitutes acceptance of the revised Terms.</p>
              <p><strong>9. Governing Law</strong><br>These Terms are governed by the laws of the jurisdiction in which the Service operator is established, without regard to conflict-of-law principles.</p>
            `;
          } else {
            title.textContent = 'Privacy Policy';
            body.innerHTML = `
              <p class="muted" style="font-size:var(--t-micro);margin-bottom:10px;">Last updated: September 2026</p>
              <p><strong>1. Overview</strong><br>Astrology AI ("we", "us") respects your privacy. This Policy explains what personal data we collect, why we collect it, and how we protect it. By using the Service, you agree to the practices described here.</p>
              <p><strong>2. Data We Collect</strong><br><em>Account data:</em> your email address, name, and password (stored as a salted hash — never in plain text). <em>Birth data:</em> your date, time, and place of birth, which are necessary to calculate your chart. <em>Usage data:</em> limited technical data (e.g., device type) used to operate and improve the Service. We do not sell or rent your personal data to anyone.</p>
              <p><strong>3. Why We Process Birth Data</strong><br>Birth details are used exclusively to calculate your astrological chart and deliver the readings you request. They are never shown publicly, never shared with third parties, and never used for advertising or profiling.</p>
              <p><strong>4. Account Isolation &amp; Access Controls</strong><br>All charts, saved relationship profiles, conversation history, and notification preferences are isolated per account. Authorization checks are enforced server-side: you can only ever access data belonging to your own account. No other user can view your birth details or the people you save — even by guessing URLs or IDs.</p>
              <p><strong>5. Security</strong><br>All traffic is encrypted in transit (HTTPS/TLS). Passwords are hashed with a strong, salted algorithm. Session tokens are HttpOnly cookies. We apply industry-standard security practices, but no method of transmission or storage is 100% secure; we cannot guarantee absolute security.</p>
              <p><strong>6. Third-Party Services</strong><br>We may use trusted third-party providers (e.g., Stripe for payments, Google for optional sign-in) strictly to operate the Service. Payments are processed by Stripe on its own secure infrastructure; your card details are never stored by us. Google Sign-In shares with us only the account information you authorize (e.g., name and email).</p>
              <p><strong>7. Data Retention</strong><br>We retain your data for as long as your account is active. You may request deletion of your account and associated data at any time by contacting us. To the extent required by law, we honour data-access, correction, and deletion requests.</p>
              <p><strong>8. Children</strong><br>The Service is intended for users aged 16 and over (13+ in jurisdictions where applicable law permits). If you believe a minor has provided us personal data without consent, contact us and we will delete it.</p>
              <p><strong>9. International Transfers</strong><br>If you access the Service from outside the country where our infrastructure is hosted, your data may be processed in that country. By using the Service, you consent to such processing.</p>
              <p><strong>10. Changes to This Policy</strong><br>We may update this Policy from time to time. Material changes will be reflected here with an updated "Last updated" date. Continued use of the Service after changes constitutes acceptance.</p>
              <p><strong>11. Contact</strong><br>For privacy or account-deletion requests, contact <a href="mailto:srivamsireddykarri@gmail.com">srivamsireddykarri@gmail.com</a>.</p>
            `;
          }
          document.getElementById('sheet-scrim').classList.add('open');
          document.getElementById('sheet').classList.add('open');
          document.body.style.overflow = 'hidden';
        }

    function closeModal() {
      document.getElementById('sheet').classList.remove('open');
      document.getElementById('sheet-scrim').classList.remove('open');
      document.body.style.overflow = '';
    }
  </script>
</body>
</html>
